name: Real YOLO CPU smoke test

# Run only when model assets, this smoke test, or its workflow change.
# Ordinary docs and application PRs keep using the lightweight checks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-yolo-smoke.yml'
      - 'inference/tests/smoke_real_model.py'
      - 'inference/weights/**'

permissions:
  contents: read

jobs:
  all-crop-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics
        run: python -m pip install ultralytics
      - name: Run real crop checkpoints on CPU
        run: python inference/tests/smoke_real_model.py
