name: Real YOLO CPU smoke test

# Intentionally manual: installing CPU inference dependencies is expensive
# and model compatibility needs deliberate review.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheat-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics
        run: python -m pip install ultralytics
      - name: Run a real sample prediction on CPU
        run: python inference/tests/smoke_real_model.py
