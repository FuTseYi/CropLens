name: Inference regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prediction-confidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-check all inference Python modules
        run: python -m compileall -q inference
      - name: Validate local Markdown links
        run: python scripts/check_docs_links.py
      - name: Check YOLO confidence regression
        working-directory: inference
        run: python -m unittest discover -s tests -v
