spring.application.name=Ece
mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.example.Ece.mybatis.entity
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/cropdisease?serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
server.port=9999
# Bind to loopback for local development; never expose the optional DeepSeek relay publicly.
server.address=${SERVER_BIND_ADDRESS:127.0.0.1}
file.ip=localhost
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
file.upload-dir=files

# Disabled by default; local development demo only. Do not expose unauthenticated AI proxy publicly.
deepseek.proxy.enabled=${DEEPSEEK_PROXY_ENABLED:false}
deepseek.api.key=${DEEPSEEK_API_KEY:}
